<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="shieldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#19D3D8"/>
            <stop offset="100%" stop-color="#1577FF"/>
        </linearGradient>
        <linearGradient id="heartGrad" x1="24" y1="40" x2="40" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2C9CFF"/>
            <stop offset="100%" stop-color="#1577FF"/>
        </linearGradient>
    </defs>

    <!-- shield -->
    <path
            d="M32 6 L47 11 C51 12.5 54 16 54 20.5 V31 C54 40 47.8 47.5 32 58 C16.2 47.5 10 40 10 31 V20.5 C10 16 13 12.5 17 11 L32 6 Z"
            fill="#ffffff"
            stroke="url(#shieldGrad)"
            stroke-width="4.5"
            stroke-linejoin="round"
    />

    <!-- antenna -->
    <line x1="32" y1="15" x2="32" y2="20" stroke="#1B8CFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="12" r="2.6" fill="#1B8CFF"/>

    <!-- robot head outer -->
    <rect x="18" y="18" width="28" height="20" rx="8" fill="#ffffff" stroke="#1B8CFF" stroke-width="3"/>

    <!-- ears -->
    <rect x="14" y="24" width="4.5" height="8" rx="2.2" fill="#1B8CFF"/>
    <rect x="45.5" y="24" width="4.5" height="8" rx="2.2" fill="#1B8CFF"/>

    <!-- face -->
    <rect x="21" y="22" width="22" height="12" rx="6" fill="#0A2D63"/>

    <!-- eyes -->
    <path d="M25.5 28 C25.5 26.3 26.8 25 28.5 25 C30.2 25 31.5 26.3 31.5 28" fill="none" stroke="#ffffff"
          stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32.5 28 C32.5 26.3 33.8 25 35.5 25 C37.2 25 38.5 26.3 38.5 28" fill="none" stroke="#ffffff"
          stroke-width="2.2" stroke-linecap="round"/>

    <!-- upright heart -->
    <path
            d="M32 49
       L24.8 42.2
       C22.6 40.1 22.6 36.7 24.8 34.6
       C27 32.5 30.2 32.7 32 35
       C33.8 32.7 37 32.5 39.2 34.6
       C41.4 36.7 41.4 40.1 39.2 42.2
       Z"
            fill="url(#heartGrad)"
    />
</svg>